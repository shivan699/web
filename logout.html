<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout - Campus Job Portal</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #6b6b9a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: #d9d9e0;
        padding: 40px;
        border-radius: 20px;
        width: 350px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
        color: #0a0a5e;
        margin-bottom: 10px;
    }

    p {
        color: #444;
        margin-bottom: 25px;
    }

    .btn {
        display: block;
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    .login-btn {
        background: #0a0a5e;
        color: white;
    }

    .login-btn:hover {
        background: #00004d;
    }

    .home-btn {
        background: transparent;
        color: #0a0a5e;
        border: 1px solid #0a0a5e;
    }

    .home-btn:hover {
        background: #0a0a5e;
        color: white;
    }

    .icon {
        font-size: 50px;
        margin-bottom: 15px;
    }
</style>

</head>
<body>

<div class="card">
    <div class="icon">🔒</div>
    
    <h1>Logged Out</h1>
    <p>You have been successfully logged out of your Campus Job Portal account.</p>

    <button class="btn login-btn" onclick="login()">
        Login Again
    </button>

    <button class="btn home-btn" onclick="home()">
        Go to Home
    </button>
</div>

<script>
    function login() {
        window.location.href = "LOGIN.html"; // change if needed
    }

    function home() {
        window.location.href = "index.html"; // change if needed
    }
</script>

</body>
</html>
