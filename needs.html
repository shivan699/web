<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      display: flex;
      height: 100vh;
      background: #ecf0f1;
    }

    .dashboard {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 250px;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      height: 100%;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      margin-bottom: 15px;
    }

    .sidebar ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      display: block;
      padding: 10px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background-color: #34495e;
    }

    /* AI Chat sidebar link special style */
    .sidebar ul li a.ai-link {
      background: linear-gradient(135deg, #1a6b4a, #0e4a33);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      font-weight: 600;
    }

    .sidebar ul li a.ai-link:hover {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: white;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      flex-grow: 1;
      padding: 20px;
      background-color: #ecf0f1;
      overflow-y: auto;
    }

    .main-content h1 {
      margin-top: 0;
    }

    #content {
      margin-top: 20px;
      padding: 20px;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 60%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .form-actions {
      margin-top: 20px;
    }

    .form-actions button {
      padding: 10px 20px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .form-actions button:hover {
      background-color: #34495e;
    }

    .button-container {
      margin: 0rem 0rem 2.5rem 7rem;
      height: 100%;
    }

    .btn {
      border: 1px solid #000;
      background-color: transparent;
      color: #000;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      margin: 5px;
    }

    .btn:hover {
      background-color: #000;
      color: #fff;
    }

    .btn a {
      text-decoration: none;
      color: inherit;
    }

    .btn a:hover {
      color: inherit;
    }

    .announcement {
      margin-bottom: 20px;
    }

    .announcement h3 {
      margin-bottom: 10px;
    }

    .announcement p {
      font-size: 16px;
      line-height: 1.5;
    }

    .announcement small {
      color: #777;
    }

    /* ===== AI CHATBOX ===== */
    #ai-chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      max-height: 700px;
    }

    #ai-chat-container h2 {
      margin-bottom: 6px;
      color: #2c3e50;
    }

    #ai-chat-container .chat-subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 14px;
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      background: #f8fafd;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      animation: bubblePop 0.2s ease;
    }

    @keyframes bubblePop {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .chat-bubble.user {
      background: #2c3e50;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-bubble.ai {
      background: white;
      color: #222;
      align-self: flex-start;
      border: 1px solid #e0e6f0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .chat-bubble.ai .ai-label {
      font-size: 11px;
      color: #2ecc71;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: white;
      border: 1px solid #e0e6f0;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      align-items: flex-end;
    }

    .chat-input-row textarea {
      flex: 1;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      resize: none;
      height: 48px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-row textarea:focus {
      border-color: #2c3e50;
    }

    .chat-send-btn {
      padding: 12px 22px;
      background: #2c3e50;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      height: 48px;
      white-space: nowrap;
    }

    .chat-send-btn:hover {
      background: #34495e;
      transform: translateY(-1px);
    }

    .chat-send-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
      transform: none;
    }

    .chat-clear-btn {
      padding: 8px 14px;
      background: transparent;
      color: #e74c3c;
      border: 1px solid #e74c3c;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: 0.2s;
    }

    .chat-clear-btn:hover {
      background: #e74c3c;
      color: white;
    }

    .chat-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .suggested-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .suggested-prompts button {
      background: #eaf4fb;
      border: 1px solid #bee3f8;
      color: #2980b9;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Poppins', sans-serif;
    }

    .suggested-prompts button:hover {
      background: #2980b9;
      color: white;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .dashboard { flex-direction: column; }
      .sidebar { width: 100%; height: auto; padding: 12px; }
      .sidebar ul { display: flex; flex-wrap: wrap; gap: 6px; }
      .sidebar ul li { margin-bottom: 0; }
      .sidebar ul li a { font-size: 13px; padding: 7px 10px; }
      .main-content { padding: 12px; }
      #ai-chat-container { height: 80vh; }
      .form-group input { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <div class="sidebar">
      <h2>Student Portal</h2>
      <ul>
        <li><a href="#" id="dashboard">Dashboard</a></li>
        <li><a href="#" id="aptitude">Aptitude</a></li>
        <li><a href="#" id="tech">DSA Practice</a></li>
        <li><a href="#" id="Mockinterview">Mock-Interview</a></li>
        <li><a href="#" id="resume">Resume Builder</a></li>
        <li><a href="v.html" id="resumeats">Resume Scanner</a></li>
        <li><a href="CP.HTML" id="announcements">Announcements</a></li>
        <li><a href="#" id="aichat" class="ai-link">🤖 AI Assistant</a></li>
        <li><a href="infom.html" id="info">Profile</a></li>
        <li><a href="logout.html" id="logout">Logout</a></li>
        
      </ul>
    </div>

    <div class="main-content">
      <h1>Welcome, <span id="fullName">Student</span></h1>
      <div id="content">
        <p>Select an option from the sidebar to view more details.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const content = document.getElementById('content');

      const fullName = localStorage.getItem('fullName');
      if (fullName) {
        document.getElementById('fullName').textContent = fullName;
      }

      // ===== DASHBOARD =====
      document.getElementById('dashboard').addEventListener('click', function () {
        content.innerHTML = '<h2>Dashboard</h2><p>Welcome to your dashboard. Here you will find an overview of your activities and performance.</p>';
      });

      // ===== APTITUDE =====
      document.getElementById('aptitude').addEventListener('click', function (event) {
        event.preventDefault();
        content.innerHTML = `
          <h2>Aptitude Options</h2>
          <button id="quizButton" class="btn">Aptitude Quiz</button>
          <button id="dashboardButton" class="btn">Result Analysis &amp; Visualization</button>
        `;
        document.getElementById('quizButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8501';
        });
        document.getElementById('dashboardButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8502';
        });
      });

      // ===== MOCK INTERVIEW =====
      document.getElementById('Mockinterview').addEventListener('click', function (event) {
        event.preventDefault();
        content.innerHTML = `
          <h2>Mock Interview</h2>
          <button id="interButton" class="btn">Start Interview</button>
        `;
        document.getElementById('interButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8505';
        });
      });

      // ===== RESUME BUILDER =====
      document.getElementById('resume').addEventListener('click', function () {
        content.innerHTML = `
          <h2>Resume</h2>
          <p>Create Your Professional Resume With Resume Builder</p>
          <div class="row">
            <div class="button-container">
              <button type="button" class="btn">
                <a href="Form.html">Create Your Resume</a>
              </button>
            </div>
          </div>
        `;
      });

      // ===== RESUME SCANNER =====
      document.getElementById('resumeats').addEventListener('click', function () {
        content.innerHTML = `
          <h2>Resume</h2>
          <p>Check if your Resume is Job Ready</p>
          <div class="row">
            <div class="button-container">
              <button type="button" class="btn">
                <a href="http://localhost:8506">Start ATS Scan</a>
              </button>
            </div>
          </div>
        `;
      });

      // ===== ANNOUNCEMENTS =====
      document.getElementById('announcements').addEventListener('click', function () {
        content.innerHTML = '<h2>Announcements</h2><p>Loading announcements...</p>';
        fetch('http://localhost:3000/announcements')
          .then((response) => response.json())
          .then((data) => {
            if (data.length > 0) {
              let announcementsHtml = '';
              data.forEach((announcement) => {
                announcementsHtml += `
                  <div class="announcement">
                    <h3>${announcement.title}</h3>
                    <p>${announcement.content}</p>
                    <p><small>Published on: ${new Date(announcement.createdAt).toLocaleString()}</small></p>
                  </div>
                  <hr/>
                `;
              });
              content.innerHTML = `<h2>Announcements</h2>${announcementsHtml}`;
            } else {
              content.innerHTML = '<h2>Announcements</h2><p>No announcements available.</p>';
            }
          })
          .catch((error) => {
            content.innerHTML = '<h2>Announcements</h2><p>Failed to load announcements. Please try again later.</p>';
          });
      });

      // ===== PROFILE =====
      document.getElementById('profile').addEventListener('click', function () {
        const storedFullName = localStorage.getItem('fullName') || '';
        const storedEmail = localStorage.getItem('email') || '';
        content.innerHTML = `
          <h2>Profile</h2>
          <form id="profileForm">
            <div class="form-group">
              <label for="fullNameInput">Full Name</label>
              <input type="text" id="fullNameInput" value="${storedFullName}" />
            </div>
            <div class="form-group">
              <label for="emailInput">Email</label>
              <input type="email" id="emailInput" value="${storedEmail}" />
            </div>
            <div class="form-group">
              <label for="passwordInput">Password</label>
              <input type="password" id="passwordInput" placeholder="Enter new password" />
            </div>
            <div class="form-actions">
              <button type="submit">Save Changes</button>
            </div>
          </form>
        `;
        document.getElementById('profileForm').addEventListener('submit', function (event) {
          event.preventDefault();
          const newFullName = document.getElementById('fullNameInput').value;
          const newEmail = document.getElementById('emailInput').value;
          const newPassword = document.getElementById('passwordInput').value;
          localStorage.setItem('fullName', newFullName);
          localStorage.setItem('email', newEmail);
          if (newPassword) { localStorage.setItem('password', newPassword); }
          document.getElementById('fullName').textContent = newFullName;
          content.innerHTML = '<p>Your profile has been updated successfully!</p>';
        });
      });

      // ===== LOGOUT =====
      document.getElementById('logout').addEventListener('click', function () {
        localStorage.clear();
        window.location.href = 'student-login.html';
      });

      // ===== DSA PRACTICE =====
      document.getElementById('tech').addEventListener('click', function (event) {
        event.preventDefault();
        content.innerHTML = `
          <h2>DSA Practice Options</h2>
          <button id="dsaQuestionsButton" class="btn">DSA Questions</button>
          <button id="dsaAnalysisButton" class="btn">DSA Analysis</button>
        `;
        document.getElementById('dsaQuestionsButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8503';
        });
        document.getElementById('dsaAnalysisButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8504';
        });
      });

      // ===== AI CHATBOX =====
      // Conversation history for multi-turn memory
      let chatHistory = [];

      const suggestedQuestions = [
        "How do I prepare for DSA interviews?",
        "Tips for resume writing",
        "Common aptitude topics",
        "How to crack mock interviews?",
        "Best resources for placement prep"
      ];

      document.getElementById('aichat').addEventListener('click', function (event) {
        event.preventDefault();

        // Remove active class from others
        document.querySelectorAll('.sidebar ul li a').forEach(a => a.classList.remove('active'));
        this.classList.add('active');

        // Build suggested prompt buttons HTML
        const suggestedHTML = suggestedQuestions.map(q =>
          `<button class="suggested-btn" data-q="${q}">${q}</button>`
        ).join('');

        content.innerHTML = `
          <div id="ai-chat-container">
            <div class="chat-header-row">
              <div>
                <h2>🤖 AI Placement Assistant</h2>
                <p class="chat-subtitle">Ask anything about placements, DSA, resume, aptitude, or interviews.</p>
              </div>
              <button class="chat-clear-btn" id="clearChatBtn">Clear Chat</button>
            </div>
            <div class="suggested-prompts" id="suggestedPrompts">
              ${suggestedHTML}
            </div>
            <div class="chat-window" id="chatWindow">
              <div class="chat-bubble ai">
                <div class="ai-label">AI Assistant</div>
                Hi ${localStorage.getItem('fullName') || 'there'}! 👋 I'm your Placement AI Assistant. Ask me anything about interviews, DSA, aptitude, resume tips, or placement strategies!
              </div>
            </div>
            <div class="chat-input-row">
              <textarea id="chatInput" placeholder="Type your question here... (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
              <button class="chat-send-btn" id="chatSendBtn">Send ➤</button>
            </div>
          </div>
        `;

        // Restore chat history if any
        if (chatHistory.length > 0) {
          const chatWindow = document.getElementById('chatWindow');
          chatWindow.innerHTML = '';
          chatHistory.forEach(turn => {
            appendBubble(turn.role === 'user' ? 'user' : 'ai', turn.content, chatWindow);
          });
        }

        // Suggested prompts click
        document.getElementById('suggestedPrompts').addEventListener('click', function(e) {
          if (e.target.classList.contains('suggested-btn')) {
            document.getElementById('chatInput').value = e.target.dataset.q;
            sendMessage();
          }
        });

        // Send button
        document.getElementById('chatSendBtn').addEventListener('click', sendMessage);

        // Enter key (without shift) to send
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });

        // Clear chat
        document.getElementById('clearChatBtn').addEventListener('click', function() {
          chatHistory = [];
          const chatWindow = document.getElementById('chatWindow');
          chatWindow.innerHTML = `
            <div class="chat-bubble ai">
              <div class="ai-label">AI Assistant</div>
              Chat cleared! How can I help you with your placement preparation?
            </div>
          `;
        });
      });

      // ---- Helper: append a bubble ----
      function appendBubble(role, text, windowEl) {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${role}`;
        if (role === 'ai') {
          bubble.innerHTML = `<div class="ai-label">AI Assistant</div>${formatText(text)}`;
        } else {
          bubble.textContent = text;
        }
        windowEl.appendChild(bubble);
        windowEl.scrollTop = windowEl.scrollHeight;
        return bubble;
      }

      // ---- Helper: basic markdown-like formatting ----
      function formatText(text) {
        return text
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`(.*?)`/g, '<code style="background:#f0f0f0;padding:2px 5px;border-radius:3px;font-size:13px;">$1</code>')
          .replace(/\n/g, '<br>');
      }

      // ---- Main send function ----
      async function sendMessage() {
        const input = document.getElementById('chatInput');
        const chatWindow = document.getElementById('chatWindow');
        const sendBtn = document.getElementById('chatSendBtn');
        const userText = input.value.trim();
        if (!userText) return;

        // Show user bubble
        appendBubble('user', userText, chatWindow);
        input.value = '';
        sendBtn.disabled = true;

        // Add to history
        chatHistory.push({ role: 'user', content: userText });

        // Show typing indicator
        const typingEl = document.createElement('div');
        typingEl.className = 'typing-indicator';
        typingEl.innerHTML = '<span></span><span></span><span></span>';
        chatWindow.appendChild(typingEl);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 1000,
              system: `You are an expert Placement AI Assistant embedded in a Campus Placement Portal for engineering students. 
Your role is to help students with:
- DSA (Data Structures & Algorithms) preparation and practice
- Aptitude test preparation (quantitative, logical, verbal)
- Resume writing tips and ATS optimization
- Mock interview preparation and common questions
- Placement strategies for top companies like TCS, Amazon, Google, Flipkart, Wipro
- Career guidance and soft skills

Be concise, friendly, practical, and encouraging. Use bullet points and formatting where helpful.
Always relate answers to placement and career context for engineering students in India.`,
              messages: chatHistory
            })
          });

          const data = await response.json();
          typingEl.remove();

          if (data.content && data.content[0]) {
            const aiReply = data.content[0].text;
            chatHistory.push({ role: 'assistant', content: aiReply });
            appendBubble('ai', aiReply, chatWindow);
          } else if (data.error) {
            appendBubble('ai', `⚠️ Error: ${data.error.message || 'Something went wrong. Please try again.'}`, chatWindow);
          }
        } catch (err) {
          typingEl.remove();
          appendBubble('ai', '⚠️ Could not connect to AI. Please check your internet connection and try again.', chatWindow);
          console.error('AI API error:', err);
        }

        sendBtn.disabled = false;
        input.focus();
      }

    });
  </script>
</body>

</html>
